[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-lab"
version = "0.1.0"
description = "Point-in-time NBA simulation and counterfactual analysis lab"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
nba-lab = "nba_lab.cli:main"
nba-lab-sync = "nba_lab.cli:sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
nba_lab = ["static/*"]
