name: iteration-check

on:
  push:
    branches: [codex/iteration]

concurrency:
  group: iteration-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Tests
        id: tests
        continue-on-error: true
        run: pytest -q
      - name: Report
        run: |
          echo "install_outcome=${{ steps.install.outcome }}"
          echo "tests_outcome=${{ steps.tests.outcome }}"
